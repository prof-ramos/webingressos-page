packages:
  - "."

# Defesas de supply chain do pnpm 11 mantidas explícitas no projeto.
minimumReleaseAge: 1440
blockExoticSubdeps: true
strictDepBuilds: true

# Somente dependências nativas conhecidas e necessárias ao stack podem executar
# scripts de instalação. Revise esta lista sempre que a árvore mudar.
allowBuilds:
  sharp: true
  unrs-resolver: true
